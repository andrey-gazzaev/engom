<h2>{{ group().name }}</h2>

<p>Your students</p>

<mat-table
	[dataSource]="getItems()"
	[trackBy]="trackById"
>
	<!-- First name column -->
	<ng-container [matColumnDef]="tableColumn.FirstName">
		<mat-header-cell
			*matHeaderCellDef
		>
			First name
		</mat-header-cell>
		<mat-cell *matCellDef="let user; dataSource: items()!">
			@if (isSkeletonShow()) {
				<engomc-skeleton />
			} @else {
				{{ user.firstName }}
			}
		</mat-cell>
	</ng-container>

	<!-- Last name column -->
	<ng-container [matColumnDef]="tableColumn.LastName">
		<mat-header-cell
			*matHeaderCellDef
		>
			Last name
		</mat-header-cell>
		<mat-cell *matCellDef="let user; dataSource: items()!">
			@if (isSkeletonShow()) {
				<engomc-skeleton />
			} @else {
				{{ user.lastName }}
			}
		</mat-cell>
	</ng-container>

	<!-- Actions column -->
	<ng-container [matColumnDef]="tableColumn.Actions">
		<mat-header-cell
			*matHeaderCellDef
		>
			Actions
		</mat-header-cell>
		<mat-cell *matCellDef="let user; dataSource: items()!">
			@if (isSkeletonShow()) {
				<engomc-skeleton />
			} @else {
				<button
					type="button"
					mat-icon-button
					title="View progress"
				>
					<mat-icon>monitoring</mat-icon>
				</button>
			}
		</mat-cell>
	</ng-container>

	<mat-header-row *matHeaderRowDef="displayedColumns" />
	<mat-row *matRowDef="let row; columns: displayedColumns" />
	<tr
		*matNoDataRow
		class="table__no-data-row"
	>
		No students
	</tr>
</mat-table>
