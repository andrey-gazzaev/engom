@let currentUser = userService.currentUser$ | async;
@if (currentUser === null) {
	Loading current user...
} @else {
	<section class="dashboard-page">
		<engomw-user-groups
			class="dashboard-page__sidebar"
			[groups]="currentUser.groups"
			[selectedGroup]="selectedGroup()"
			(groupClicked)="onGroupClick($event)"
		/>

		<div></div>
		<div class="dashboard-page__content">
			@let selectedGroupValue = selectedGroup();
			@if (selectedGroupValue === null) {
				Please select group
			} @else {
				<engomw-group-students
					class="students-section"
					[group]="selectedGroupValue"
					[items]="students$ | async"
					[isLoading]="isStudentsLoading$ | async"
				/>

				<engomw-group-tasks
					[items]="groupTasks$ | async"
					[isLoading]="isGroupTasksLoading$ | async"
					(assignTaskClicked)="onAssignTaskClick()"
				/>
			}
		</div>
	</section>
}
