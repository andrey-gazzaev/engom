@let currentUser = userService.currentUser$ | async;
@if (currentUser === null) {
	Loading current user...
} @else {
	<section class="dashboard-page">
		<engomw-user-groups
			class="dashboard-page__sidebar"
			[groups]="currentUser.groups"
		/>

		<div class="dashboard-page__content">
			<h2>User dashboard</h2>

			<section>
				<h3>Your tasks</h3>

				@let userTasks = userTasks$ | async;
				@if (userTasks !== null) {
					<engomw-tasks [tasks]="userTasks" (completeClicked)="onCompleteTaskClick($event)" (uncompleteClicked)="onUncompleteTaskClick($event)"/>
				}
			</section>
		</div>
	</section>
}
